name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy to GitHub Pages via the Pages Actions pipeline (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R, Rust, or vellum packages are installed here on purpose: all
      # computational output is committed under _freeze/, so Quarto reuses it
      # instead of re-executing. Re-render locally after editing any R chunk
      # (`quarto render`) and commit the refreshed _freeze/ directory.
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
