name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy to GitHub Pages via the Pages Actions pipeline (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish instead of aborting it: publishing this site's
# ~100 MiB artifact takes several minutes, and cancelling mid-publish leaves the
# Pages service busy, which makes the next run wait even longer.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R, Rust, or vellum packages are installed here on purpose: all
      # computational output is committed under _freeze/, so Quarto reuses it
      # instead of re-executing. Re-render locally after editing any R chunk
      # (`quarto render`) and commit the refreshed _freeze/ directory.
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      # A fingerprint the deploy job can look for on the live site, so "did this
      # commit actually publish?" is a question with an answer.
      - name: Stamp the build
        run: echo "${{ github.sha }}" > _site/build-sha.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages stops polling after 10 minutes and clamps any longer
      # `timeout` to that maximum ("timeout set to the maximum of 600000
      # milliseconds"), then reports failure. Publishing this site has been
      # taking 7 to 11 minutes, so that verdict is unreliable: deployments have
      # landed a minute after the action gave up on them. Let the step report
      # what it likes and settle the question below.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Confirm the commit is live
        if: steps.deployment.outcome == 'failure'
        run: |
          url="${{ steps.deployment.outputs.page_url || 'https://r-vellum.github.io/vellumgallery/' }}build-sha.txt"
          echo "deploy-pages gave up; polling $url for ${{ github.sha }}"
          for i in $(seq 1 40); do
            live=$(curl -fsSL -H 'Cache-Control: no-cache' "$url" 2>/dev/null | tr -d '[:space:]')
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "Published after the action stopped waiting (poll $i)."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Site still does not serve ${{ github.sha }} 20 minutes after deploy-pages timed out."
          exit 1
